
name: Build Android Release

on:
  workflow_call:
    inputs:
      version:
        description: LWJGL version
        required: true
        type: string
      upstream_ref:
        description: Exact upstream LWJGL Git ref
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: LWJGL ${{ inputs.version }} ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: config-source

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="android-lwjgl-${VERSION}"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists: $TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout LWJGL
        if: steps.existing.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: LWJGL/lwjgl3
          ref: ${{ inputs.upstream_ref }}
          path: lwjgl
          fetch-depth: 1

      - name: Set up Java 21
        if: steps.existing.outputs.exists == 'false' && inputs.version < '3.4.1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Ant
        if: steps.existing.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ant dnsutils libx11-dev

      - name: Redirect legacy Maven URL
        if: steps.existing.outputs.exists == 'false' && inputs.version <= '3.3.0'
        run: |
          REPO_IP=$(dig +short repo1.maven.org | tail -n1)
          
          if [ -z "$REPO_IP" ]; then
            REPO_IP="104.18.19.12"
          fi
          
          echo "$REPO_IP central.maven.org" | sudo tee -a /etc/hosts

      - name: Install Android SDK
        if: steps.existing.outputs.exists == 'false'
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        if: steps.existing.outputs.exists == 'false'
        run: |
          sdkmanager "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            >> "$GITHUB_ENV"

          echo "ANDROID_SDK_HOME=$ANDROID_SDK_ROOT" \
            >> "$GITHUB_ENV"

          ln -sfn "$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            "$ANDROID_SDK_ROOT/ndk-bundle"

      - name: Install Android configuration >= 3.3.0
        if: steps.existing.outputs.exists == 'false' && inputs.version >= '3.3.0'
        run: |
          mkdir -p lwjgl/config/android/arm64

          cp config-source/.github/android/3.3/build.xml \
            lwjgl/config/android/build.xml

          cp config-source/.github/android/3.3/version.script \
            lwjgl/config/android/version.script
          
          cp config-source/.github/android/3.3/arm64/libffi.a \
            lwjgl/config/android/arm64/libffi.a

      - name: Install Android configuration < 3.3.0
        if: steps.existing.outputs.exists == 'false' && inputs.version < '3.3.0'
        run: |
          mkdir -p lwjgl/config/android/arm64

          cp config-source/.github/android/3.2/build.xml \
            lwjgl/config/android/build.xml

          cp config-source/.github/android/3.2/version.script \
            lwjgl/config/android/version.script
          
          cp config-source/.github/android/3.2/vk_mem_alloc.h \
            lwjgl/config/android/vk_mem_alloc.h
          
          cp config-source/.github/android/3.2/arm64/libdynload_s.a \
            lwjgl/config/android/arm64/libdynload_s.a
          cp config-source/.github/android/3.2/arm64/libdyncall_s.a \
            lwjgl/config/android/arm64/libdyncall_s.a
          cp config-source/.github/android/3.2/arm64/libdyncallback_s.a \
            lwjgl/config/android/arm64/libdyncallback_s.a

      - name: Install patches
        if: steps.existing.outputs.exists == 'false' && inputs.version >= '3.3.0'
        run: |
          cp config-source/.github/android/3.3/compat.h \
            lwjgl/modules/lwjgl/core/src/main/c/linux/liburing/include/liburing/compat.h
          cp config-source/.github/android/3.3/LinuxConfig.h \
            lwjgl/modules/lwjgl/core/src/main/c/linux/LinuxConfig.h

      - name: Verify Android NDK
        if: steps.existing.outputs.exists == 'false'
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          ls -l "$NDK_BIN/aarch64-linux-android26-clang++"

          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Set up Java 8
        if: steps.existing.outputs.exists == 'false' && inputs.version < '3.4.1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install vk_mem_alloc patch == 3.2.2
        if: steps.existing.outputs.exists == 'false' && inputs.version == '3.2.2'
        working-directory: lwjgl
        run: |
          cp config/android/vk_mem_alloc.h modules/lwjgl/vma/src/main/c/vk_mem_alloc.h

      - name: Build Android native libraries >= 3.3.0
        if: steps.existing.outputs.exists == 'false' && inputs.version < '3.4.1' && inputs.version >= '3.3.0'
        working-directory: lwjgl
        env:
          LWJGL_BUILD_ARCH: arm64
          LWJGL_BUILD_TRIPLET: aarch64-linux-android26
        run: |
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          mkdir -p bin/libs/native/android/$LWJGL_BUILD_ARCH/org/lwjgl/
          cp config/android/$LWJGL_BUILD_ARCH/*.a bin/libs/native/android/$LWJGL_BUILD_ARCH/org/lwjgl/
          cp -r /usr/include/X11 $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/
          ant -Dplatform=android -Dbinding.remotery=false \
              -Dbinding.nfd=false -Dbinding.zstd=false -Dbinding.tinyexr=false -Dbinding.jawt=false \
              init
          LWJGL_BUILD_OFFLINE=true ANT_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m" ant -Dplatform=android -Dbinding.remotery=false -Dbinding.msdfgen=false \
              -Dbinding.nfd=false -Dbinding.zstd=false -Dbinding.tinyexr=false -Dbinding.jawt=false \
              compile-templates compile-native

      - name: Build Android native libraries < 3.3.0
        if: steps.existing.outputs.exists == 'false' && inputs.version < '3.3.0'
        working-directory: lwjgl
        env:
          LWJGL_BUILD_ARCH: arm64
          LWJGL_BUILD_TRIPLET: aarch64-linux-android26
        run: |
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          mkdir -p bin/libs/native/android/$LWJGL_BUILD_ARCH/org/lwjgl/
          mkdir -p bin/libs/android/$LWJGL_BUILD_ARCH/
          cp config/android/$LWJGL_BUILD_ARCH/*.a bin/libs/native/android/$LWJGL_BUILD_ARCH/
          cp config/android/$LWJGL_BUILD_ARCH/*.a bin/libs/android/$LWJGL_BUILD_ARCH/
          cp -r /usr/include/X11 $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/
          ant -Dplatform=android -Dbinding.remotery=false \
              -Dbinding.nfd=false -Dbinding.zstd=false -Dbinding.tinyexr=false -Dbinding.jawt=false \
              init
          LWJGL_BUILD_OFFLINE=true ANT_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m" ant -Dplatform=android -Dbinding.remotery=false -Dbinding.msdfgen=false \
              -Dbinding.nfd=false -Dbinding.zstd=false -Dbinding.tinyexr=false -Dbinding.jawt=false \
              compile-templates compile-native

      - name: Set up Java 25
        if: steps.existing.outputs.exists == 'false' && inputs.version >= '3.4.1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build Android native libraries JRE 25
        if: steps.existing.outputs.exists == 'false' && inputs.version >= '3.4.1'
        working-directory: lwjgl
        env:
          LWJGL_BUILD_ARCH: arm64
          LWJGL_BUILD_TRIPLET: aarch64-linux-android26
        run: |
          echo "LWJGL_BUILD_ARCH=$LWJGL_BUILD_ARCH"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          mkdir -p bin/libs/native/android/arm64/org/lwjgl
          mkdir -p bin/libs/native/android/$LWJGL_BUILD_ARCH/org/lwjgl/
          cp config/android/$LWJGL_BUILD_ARCH/libffi.a bin/libs/native/android/$LWJGL_BUILD_ARCH/org/lwjgl/
          cp -r /usr/include/X11 $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/
          ant -Dplatform=android -Dbinding.remotery=false -Djdk25=true \
              -Dbinding.nfd=false -Dbinding.zstd=false -Dbinding.tinyexr=false -Dbinding.jawt=false \
              init
          LWJGL_BUILD_OFFLINE=true ANT_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m" ant -Dplatform=android -Dbinding.remotery=false -Djdk25=true \
              -Dbinding.nfd=false -Dbinding.zstd=false -Dbinding.tinyexr=false -Dbinding.jawt=false \
              compile-templates compile-native

      - name: Zip LWJGL Libraries
        if: steps.existing.outputs.exists == 'false'
        run: |
          find . -name "liblwjgl*.so" | zip -j lwjgl/lwjgl-${{ inputs.version }}.zip -@

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-lwjgl-${{ inputs.version }}
          name: LWJGL ${{ inputs.version }} - Android ARM64
          target_commitish: ${{ github.sha }}
          body: |
            Android ARM64 build of LWJGL ${{ inputs.version }}.

            Upstream repository: https://github.com/LWJGL/lwjgl3
            Upstream ref: ${{ inputs.upstream_ref }}

            Built automatically using GitHub Actions.
          files: lwjgl/lwjgl-${{ inputs.version }}.zip
          fail_on_unmatched_files: true
